[package]
name = "client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dojjo"
path = "src/main.rs"

[dependencies]
dojjo-mirror = { path = "../dojjo-mirror" }
reqwest = { version = "0.13.2", features = ["json"] }
base64 = "0.22"
serde_json = "1.0.149"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
pathdiff = "0.2"
hostname = "0.4"
prost = "0.14"
libc = "0.2"
notify = "8.2.0"

[dev-dependencies]
tempfile = "3"
